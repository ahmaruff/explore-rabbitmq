services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: rabbitmq-example
    working_dir: /app
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./storage/app:/app/storage/app
      - go_mod_cache:/go/pkg/mod
    ports:
      - "8090:8090"
    env_file:
      - .env
    command: air -c .air.toml
    restart: "no"

volumes:
  go_mod_cache: