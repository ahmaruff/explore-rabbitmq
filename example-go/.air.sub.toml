
root = "."
tmp_dir = "tmp/sub"

[build]
cmd = "go build -o ./tmp/sub/main ./cmd/sub"
entrypoint = ["./tmp/sub/main"]
args_bin = []

include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "storage", "vendor", "logs", ".git", "assets"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
follow_symlink = true

poll = true
poll_interval = 500
delay = 500

stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true
main_only = false
silent = false

[misc]
clean_on_exit = true
startup_banner = ""

[screen]
clear_on_rebuild = false
keep_scroll = true
